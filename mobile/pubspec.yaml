name: gestion_commerciale_mobile
description: >
  Application mobile de la plateforme de gestion commerciale multi-boutiques.
  Miroir Flutter du frontend web (React) — même API backend, même
  architecture compte/boutique.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Localise en français les widgets Material intégrés (sélecteur de date,
  # libellés "Annuler"/"OK"...) — sans ça, ils restent en anglais par
  # défaut, quel que soit le texte déjà en français écrit à la main
  # ailleurs dans l'app (repéré en testant le sélecteur de date du
  # Tableau de bord).
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation déclarative avec gestion des redirections (équivalent de
  # react-router-dom + nos gardes ProtectedRoute / RequireStoreRoute).
  go_router: ^14.2.0

  # Gestion d'état globale (équivalent de Zustand côté web).
  provider: ^6.1.2

  # Client HTTP avec intercepteurs (équivalent de l'instance axios de
  # frontend/src/services/apiClient.js).
  dio: ^5.4.3+1

  # Stockage sécurisé du jeton de session (Keychain iOS / Keystore Android).
  flutter_secure_storage: ^9.2.2

  # Formatage des montants (GNF) et des dates. Version épinglée par
  # flutter_localizations (SDK) — ^0.19.0 ne résout plus depuis son ajout.
  intl: ^0.20.2

  # Partage natif du reçu après une vente (miroir de la Web Share API côté
  # web, ReceiptModal.jsx) — usage explicitement visé : envoyer le reçu
  # par WhatsApp directement depuis la caisse.
  share_plus: ^10.1.4

  # Photo de produit depuis l'appareil photo ou la galerie — sur mobile,
  # bien plus naturel que coller une URL d'image (seule option côté web).
  image_picker: ^1.1.2
  url_launcher: ^6.3.2

  # Préférences légères non sensibles (ex. mode d'affichage Grille/Liste de
  # la Caisse) — jamais pour des données de session, qui restent dans
  # flutter_secure_storage ci-dessus.
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
