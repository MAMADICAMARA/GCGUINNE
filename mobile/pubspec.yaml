name: gestion_commerciale_mobile
description: >
  Application mobile de la plateforme de gestion commerciale multi-boutiques.
  Miroir Flutter du frontend web (React) — même API backend, même
  architecture compte/boutique.
publish_to: 'none'
version: 1.1.2+6

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Localise en français les widgets Material intégrés (sélecteur de date,
  # libellés "Annuler"/"OK"...) — sans ça, ils restent en anglais par
  # défaut, quel que soit le texte déjà en français écrit à la main
  # ailleurs dans l'app (repéré en testant le sélecteur de date du
  # Tableau de bord).
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation déclarative avec gestion des redirections (équivalent de
  # react-router-dom + nos gardes ProtectedRoute / RequireStoreRoute).
  go_router: ^14.2.0

  # Gestion d'état globale (équivalent de Zustand côté web).
  provider: ^6.1.2

  # Client HTTP avec intercepteurs (équivalent de l'instance axios de
  # frontend/src/services/apiClient.js).
  dio: ^5.4.3+1

  # Stockage sécurisé du jeton de session (Keychain iOS / Keystore Android).
  flutter_secure_storage: ^9.2.2

  # Formatage des montants (GNF) et des dates. Version épinglée par
  # flutter_localizations (SDK) — ^0.19.0 ne résout plus depuis son ajout.
  intl: ^0.20.2

  # Partage natif du reçu après une vente (miroir de la Web Share API côté
  # web, ReceiptModal.jsx) — usage explicitement visé : envoyer le reçu
  # par WhatsApp directement depuis la caisse.
  share_plus: ^10.1.4

  # Photo de produit depuis l'appareil photo ou la galerie — sur mobile,
  # bien plus naturel que coller une URL d'image (seule option côté web).
  image_picker: ^1.1.2
  url_launcher: ^6.3.2

  # Préférences légères non sensibles (ex. mode d'affichage Grille/Liste de
  # la Caisse) — jamais pour des données de session, qui restent dans
  # flutter_secure_storage ci-dessus.
  shared_preferences: ^2.3.3

  # Répertoire temporaire pour écrire la Facture PDF reçue du serveur avant
  # de la partager (share_plus a besoin d'un vrai chemin de fichier pour lui
  # donner un nom correct dans la feuille de partage — cf. orders_api.dart).
  path_provider: ^2.1.4

  # Numéro de version installée (§ cahier des charges "Système de
  # notification de mise à jour", décidé en conversation) — comparé au
  # version_code publié côté serveur pour détecter une mise à jour
  # disponible. L'app étant distribuée en APK direct (hors Play Store), ce
  # mécanisme remplace celui qu'un store fournirait normalement.
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Génère les icônes Android/iOS à partir d'une seule image source (§
  # déploiement Play Store, décidé en conversation) — jamais utilisé à
  # l'exécution, uniquement en ligne de commande pendant le développement.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# Configuration de flutter_launcher_icons (§ déploiement Play Store) — une
# seule image source (le logo GCG déjà recadré en cercle sur fond carré).
# Volontairement PAS de couche adaptative séparée (adaptive_icon_foreground/
# background) : notre image est déjà "à plat" (fond inclus dedans, pas de
# calque transparent), donc la fournir telle quelle comme premier plan
# adaptatif risquerait un zoom/recadrage imprévisible par Android (le
# système agrandit et recentre le premier plan pour respecter sa zone de
# sécurité). Android traite déjà correctement une icône "legacy" comme
# celle-ci sur tous les lanceurs modernes — pas besoin de plus pour une
# première publication.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
